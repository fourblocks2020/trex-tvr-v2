name: Verify container contract

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate checked-out source identity
        run: python scripts/image_release.py validate-checkout --actual "$(git rev-parse HEAD)" --expected "${GITHUB_SHA}"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned uv
        run: python -m pip install "uv==0.11.14"

      - name: Synchronize locked verification environment
        run: uv sync --extra dev --locked

      - name: Validate package and runtime versions
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          python scripts/image_release.py validate-versions \
            --ref "refs/tags/v${VERSION}" \
            --pyproject pyproject.toml \
            --runtime-init trex_tvr/__init__.py
          printf 'RELEASE_VERSION=%s\n' "${VERSION}" >> "${GITHUB_ENV}"

      - name: Run full repository regression
        run: uv run pytest -q

      - name: Lint new release code and contracts
        run: uv run ruff check scripts/image_release.py tests/release

      - name: Create excluded synthetic canary
        run: printf '%s\n' 'TREX_TVR_SECRET_CANARY_DO_NOT_SHIP' > .env.ci-canary

      - name: Build source image once without registry publication
        run: |
          docker build --provenance=false \
            --platform linux/amd64 \
            --build-arg "SOURCE_COMMIT=${GITHUB_SHA}" \
            --build-arg "RELEASE_VERSION=${RELEASE_VERSION}" \
            --tag "tvr-verify:${GITHUB_SHA}" .

      - name: Smoke package, CLIs, and isolated startup
        run: python scripts/image_release.py smoke --image "tvr-verify:${GITHUB_SHA}" --timeout 120

      - name: Export and scan exact verified image
        run: |
          docker save --output tvr-verify-image.tar "tvr-verify:${GITHUB_SHA}"
          set +e
          python scripts/image_release.py scan \
            --image "tvr-verify:${GITHUB_SHA}" \
            --archive tvr-verify-image.tar \
            >canary-scan.stdout 2>canary-scan.stderr
          scan_status=$?
          set -e
          python scripts/image_release.py assert-clean-output canary-scan.stdout canary-scan.stderr
          exit "${scan_status}"
