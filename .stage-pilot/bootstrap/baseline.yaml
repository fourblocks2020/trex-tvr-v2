schema_version: 1
capture_mode: observed # trex-strategy-template 코드 관찰 + 사장님 선언(tvr-v1 bootstrap 지시)

project:
  repository_name: trex-tvr-v1
  display_name: Trex TVR v1
  summary: >-
    constant-mix 목표비율 리밸런싱 장기전략 데몬. 포트폴리오 종목별 비율이
    목표(target_weight)에서 임계치 이상 벗어날 때 매수 인텐트를 발행해 비율을 복원한다.
    trex-core 슬롯 코어와 순수 AMQP wire 계약으로 연동하며, trex_core 코드를 직접 import하지 않는다.
  primary_domain: 자동매매 장기전략 — 목표비율(constant-mix) 리밸런싱 매수

stack:
  tech_stack:
    - Python >=3.12
    - pyproject.toml 기반 패키지(setuptools), 배포명 trex-tvr-v1 / 패키지 trex_tvr
    - pytest(단위 테스트), ruff(린트)
    - pika — RabbitMQ AMQP 클라이언트(trex-core wire 계약 직접 구현, 코드 무의존)
    - httpx — kis-data-hub 시세 클라이언트(현재가/분봉)
    - redis(선택) — holiday 캐시
    - per-instance TOML(--config) + .env 설정

runtime:
  primary_runtime: worker
  primary_entrypoints:
    - name: trex-tvr (console_script → trex_tvr.runtime.cli:main)
      purpose: >-
        TVR 리밸런싱 전략 데몬. --config <path>.toml 로 기동(instance_key/rabbitmq/kis-data-hub/
        schedule/tvr 파라미터). snapshot RPC 폴링 + 현재가 fetch + 목표비율 편차 평가 +
        buy intent 발행 루프, trex.events 구독으로 체결/슬롯 이벤트 수신.
    - name: trex-tvr-backtest (console_script → trex_tvr.backtest.cli:main)
      purpose: >-
        전략-무관 백테스트(로컬 분봉 덤프 시간 리플레이). trex-tvr과 동일 전략/파라미터로 백테스트.
    - name: trex.snapshot.req / trex.intent.req / trex.events (RabbitMQ, trex-core wire 계약)
      purpose: trex-core 슬롯 코어와의 transport — 스냅샷 조회, 매수 admission 제출, 체결/슬롯 이벤트 구독.

interfaces:
  contracts:
    - name: trex-core RabbitMQ wire 계약(consumed)
      type: event
      actors: trex-tvr-v1 데몬(클라이언트/producer) ↔ trex-core 데몬(서버), RabbitMQ broker가 transport
      purpose: >-
        snapshot RPC로 universe + 가용 슬롯 조회, intent RPC로 buy admission 제출,
        events 구독으로 체결/슬롯 상태 수신.
      stability: experimental
      inputs:
        - "trex.snapshot.req 요청 {view:all|buyable|held, strategy_key, trading_date}"
        - "trex.intent.req buy {intent_type:buy, intent_id, trading_date, symbol, qty?, allocated_capital?, entry_price?, strategy_id, stop_loss_price?, take_profit_price?}"
      outputs:
        - "snapshot 응답 {assets[], view, available_slots, degraded, reason, message}"
        - "intent 응답 {intent_id, status:admitted|rejected, slot_id?, reason?}"
        - "trex.events {event_type:slot_filled_buy|slot_filled_sell|..., slot_id, strategy_id?, symbol?, status}"
      errors:
        - "TransportUnavailableError — connected 아닐 때 즉시 실패"
        - "RpcTimeoutError — timeout 안에 reply 없음"
      compatibility_rules:
        - "wire 계약 소유자는 trex-core. trex-tvr-v1은 JSON payload 호환만 공유, trex_core 코드 무import."
        - "intent correlation_id(=intent_id)가 멱등키 — core intent_log가 dedup."
    - name: kis-data-hub HTTP client(consumed)
      type: other
      actors: trex-tvr-v1 시세 어댑터(소비) → kis-data-hub
      purpose: 현재가 및 분봉 조달(core snapshot에 price 없음).
      stability: experimental
      inputs:
        - "get_quote(code, allow_stale) → POST /v1/quotes/latest"
        - "get_candles(code, count) → POST /v1/candles/minute"
      outputs:
        - "quote item: {... price ...}"
        - "candles: list[{datetime, open, high, low, close, volume}]"
      errors:
        - "KisDataHubClientError(error_class ∈ {auth, network, http, schema_drift, other})"
      compatibility_rules:
        - "Bearer 인증"
    - name: trex-tvr-v1 데몬 CLI / config(own)
      type: cli
      actors: 운영자
      purpose: per-instance TOML(--config) + env로 데몬 기동/튜닝.
      stability: experimental
      inputs:
        - "--config <path>.toml (필수): instance_key, rabbitmq_url, kis_data_hub_base_url/api_key, schedule, tvr_v1 params"
        - "env: 시크릿(api key) 등"
      outputs:
        - "장기 실행 데몬 프로세스 + 구조적 로그/감사"
      errors:
        - "config 검증 실패 시 fail-closed 기동 거부"
      compatibility_rules:
        - "trex-core의 --config per-instance 컨벤션과 정합(instance_key 분리)."
  shared_constraints:
    - "슬롯 상태의 단일 writer는 trex-core(불변식 A). trex-tvr-v1은 슬롯/원장을 직접 쓰지 않고 읽기 + buy intent 제출만 한다."
    - "exit(청산)는 매수 intent의 stop_loss_price/take_profit_price로 선언 → trex-core SafetySellService 자율 수행."
  current_gaps:
    - "리밸런싱 sell-intent 경로 미구현 — transport/intent_builder에 sell-intent 추가 + decision-cycle 확장이 필요(첫 Discovery 대상)."
    - "TVR 파라미터(target_weight, rebalance_threshold, 평가 주기)는 미확정 — 첫 Discovery에서 확정."

structure:
  planned_top_level_areas:
    - path: trex_tvr/
      responsibility: TVR 리밸런싱 전략 데몬 패키지.
    - path: trex_tvr/strategies/
      responsibility: TvrStrategy(BuyStrategy) + 출력 dataclass + registry/schedule.
    - path: trex_tvr/market_data/
      responsibility: kis-data-hub httpx 클라이언트(현재가/분봉) + Redis holiday 캐시.
    - path: trex_tvr/transport/
      responsibility: trex-core RabbitMQ wire 클라이언트(snapshot RPC, intent RPC, events 구독) — pika 직접 구현.
    - path: trex_tvr/runtime/
      responsibility: daemon(폴링 루프/스케줄) + config(per-instance TOML) + cli 진입점.
    - path: trex_tvr/backtest/
      responsibility: 전략-무관 백테스트 엔진(로컬 덤프 시간 리플레이).
    - path: tests/
      responsibility: pytest 단위 테스트(import sweep 시임 / 전략 결정성 / engine smoke).
    - path: docs/
      responsibility: SDLC baseline 문서 + active index.

data_model:
  persistence_backend: >-
    없음(stateless 전략 데몬) — 슬롯/원장 영속화는 trex-core(PostgreSQL)가 소유.
    선택적 Redis로 holiday 캐시만 둔다.
  entities:
    - name: BuyIntent(wire DTO)
      purpose: TVR 평가 결과를 trex-core로 보내는 매수 admission 요청.
      source_of_truth: RabbitMQ 메시지(전이 권위는 trex-core daily_slot/intent_log)
      lifecycle: 평가(BuySignal) -> intent 발행 -> core admitted|rejected -> events로 체결 수신
      key_fields:
        - "intent_id :: str :: correlation_id이자 멱등키"
        - "symbol :: str :: 대상 종목"
        - "qty / allocated_capital :: number :: 주문 수량 / 배정 자본"
        - "entry_price :: int :: 결정 시점 시세"
        - "strategy_id :: str :: \"tvr_v1\""
        - "stop_loss_price / take_profit_price :: number? :: core safety-sell 가격 트리거"
      relationships:
        - "Slot(trex-core 소유) :: admitted 시 idle -> pending_buy 슬롯과 1:1 결합"
      state_rules:
        - "동일 intent_id 재전송은 core가 dedup."
    - name: HolidayCache(Redis, 선택)
      purpose: 거래일/공휴일 판정 캐시 — 매 cycle API 호출 회피.
      source_of_truth: Redis(선택; 없으면 kis-data-hub로 매번 조회)
      lifecycle: 조회 시 set(TTL 24h) -> 같은 거래일 hit
      key_fields:
        - "key :: str :: 거래일 날짜 기반 네임스페이스"
      relationships:
        - "kis-data-hub /v1/market/holiday-check :: 캐시 미스 시 조회"
      state_rules:
        - "비권위 파생 캐시 — 유실 시 재조회, 정합성 부담 없음."
  consistency_rules:
    - "슬롯 상태/원장 기록의 단일 source of truth는 trex-core. trex-tvr-v1은 snapshot/events로 읽기만."
    - "intent 멱등키(correlation_id)로 중복 매수 admission을 방지."
  persistence_notes:
    - "trex-tvr-v1은 자체 DB를 두지 않는다."
  current_gaps:
    - "TVR 파라미터(target_weight, rebalance_threshold) 엔티티/저장 방식 미정."

notes:
  known_unknowns:
    - "TVR 목표비율 파라미터(target_weight, rebalance_threshold, 평가 주기) 확정값 미정."
    - "리밸런싱 매도(SellIntent) 경로 설계 — transport/intent_builder 확장 필요."
    - "schedule TOML 스키마 및 exit 파라미터 기본값의 TVR 최적값."

metadata:
  captured_at_kst: 2026-07-02 00:00
