# Per-instance configuration (TVR runtime settings + identity).
# Start the daemon:   trex-tvr run --config instance.example
# Check status:       trex-tvr status
# Shared infra + secrets live in .env (NOT here) — see config/.env.example.

instance_key = "tvr-default"
# BAT-002 REQ-006: poll_interval (seconds, int). 60s floor + no-sleep drain when cycle exceeds.
poll_interval = 60  # seconds; minimum effective interval between cycle starts
rpc_timeout_seconds = 5
worker_count = 20

# BAT-002 REQ-007: trex-core instance keys for fan-in (list). Single item = backward compat.
# instances = ["default"]           # single instance (default)
# instances = ["longterm", "midterm"]  # multi-instance fan-in

# BAT-002 REQ-005: session window (KST wall clock, 08:00–20:00 NXT full session).
# session_start = "08:00"   # default; daemon active from this time
# session_end   = "20:00"   # default; daemon active until this time

# Schedule windows are KST "HH:MM". With REQ-005 session gate, set to full session window.
[[schedule]]
start = "08:00"
end   = "20:00"

# [strategy.tvr_v1]: TVR에는 런타임 설정만 — 리밸런싱 파라미터(target_weight,
# rebalance_band_pct, min_trade_krw)는 portfolio-hub strategy_sets에서 관리하고
# trex-core 슬롯 row로 데몬에 전달된다. 이 테이블은 비워 두거나 런타임 힌트만 넣는다.
[strategy.tvr_v1]
# 운영 파라미터 예시 (실제 값은 portfolio-hub strategy_sets에서 per-slot 전달):
# target_weight = 0.70        # (portfolio-hub 소관 — 여기서 설정 금지)
# rebalance_band_pct = 5.0    # (portfolio-hub 소관 — 여기서 설정 금지)
# min_trade_krw = 10000        # (portfolio-hub 소관 — 여기서 설정 금지)

# [exit] 섹션은 TVR에서 불필요 (순수 리밸런싱, SL/TP 미선언).
# ORB/TSL 전략 데몬에서는 아래와 같이 선언한다:
# [exit]
# stop_loss_pct = 2.0
# take_profit_pct = 4.0

# Optional execution policy (omit the whole section to keep core defaults).
[execution]
timeout_sec = 30
slippage_pct = 0.5

# RabbitMQ liveness profile owned and validated by TVR. Do not duplicate these
# as heartbeat/blocked_connection_timeout/socket_timeout query parameters in
# TREX_RABBITMQ_URL; duplicate authority fails startup.
[rabbitmq_connection]
heartbeat_seconds = 30
blocked_connection_timeout_seconds = 30
socket_timeout_seconds = 10
